<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teleprompter Pessoal e Gratuito</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      height: 100%;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Config Screen */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .header-box {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #facc15;
      font-weight: 700;
      margin-bottom: 8px;
      background: #1c1917;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #292524;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 13px;
      color: #a3a3a3;
    }
    .editor-card {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .textarea-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #d4d4d4;
    }
    .sample-btn {
      background: #171717;
      color: #a3a3a3;
      border: 1px solid #262626;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .sample-btn:hover {
      color: #ffffff;
      background: #262626;
    }
    textarea {
      width: 100%;
      height: 280px;
      background: #000000;
      color: #f5f5f5;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    textarea:focus {
      border-color: #facc15;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #1c1c1c;
      font-size: 12px;
      color: #737373;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .btn-primary {
      background: #facc15;
      color: #000000;
      border: none;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 700;
      flex: 2;
      min-width: 200px;
      box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #eab308;
    }
    .btn-secondary {
      background: #171717;
      color: #e5e5e5;
      border: 1px solid #262626;
      padding: 14px 18px;
      font-size: 14px;
      flex: 1;
    }

    /* Reading Screen */
    #prompter-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: auto !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      z-index: 10;
    }
    #prompter-screen::-webkit-scrollbar {
      display: none;
    }
    #prompter-screen {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Reading Content */
    #prompter-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 35vh 20px 100vh 20px;
      min-height: 150vh;
      text-align: center;
      transition: transform 0.2s ease;
      will-change: transform;
    }
    #prompter-text {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-weight: 700;
      color: #ffffff;
      font-size: 44px;
    }

    /* Mirroring */
    .mirror-x {
      transform: scaleX(-1);
    }

    /* Eye Line Guide */
    #eye-guide {
      position: fixed;
      top: 35%;
      left: 0;
      right: 0;
      height: 44px;
      pointer-events: none;
      border-top: 2px dashed rgba(250, 204, 21, 0.4);
      border-bottom: 2px dashed rgba(250, 204, 21, 0.4);
      background: rgba(250, 204, 21, 0.05);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .guide-marker {
      color: #facc15;
      font-size: 18px;
      font-weight: 900;
      opacity: 0.8;
    }

    /* Mobile Quick Tap Hint */
    #tap-hint {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(23, 23, 23, 0.7);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      color: #a3a3a3;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.5s ease;
    }

    /* HUD Bar */
    #hud-panel {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 95vw;
      overflow-x: auto;
    }
    #hud-panel.hidden {
      opacity: 0;
      transform: translate(-50%, 60px);
      pointer-events: none;
    }

    .hud-btn {
      background: #262626;
      color: #ffffff;
      border: 1px solid #404040;
      padding: 8px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      min-height: 40px;
    }
    .hud-btn:active {
      background: #333333;
    }
    .hud-btn.active {
      background: #facc15;
      color: #000000;
      border-color: #facc15;
    }
    .hud-btn-main {
      background: #facc15;
      color: #000000;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      min-height: 42px;
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
    }
    .hud-btn-main:active {
      transform: scale(0.96);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      border-left: 1px solid #333;
    }
    .control-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a3a3a3;
      white-space: nowrap;
    }
    input[type=range] {
      accent-color: #facc15;
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      width: 70px;
    }
    .val-display {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: #facc15;
      font-weight: 700;
      min-width: 26px;
    }

    #exit-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 14px;
      background: rgba(23, 23, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 60;
      backdrop-filter: blur(8px);
    }

    #toggle-hud-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: 14px;
      background: rgba(23, 23, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      z-index: 60;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- CONFIG SCREEN -->
  <div id="setup-screen">
    <div class="header-box">
      <span class="badge">Teleprompter Gratuito & Offline</span>
      <h1>Teleprompter Pessoal</h1>
      <p class="subtitle">Cole seu texto, ajuste as opções e confirme para iniciar a leitura</p>
    </div>

    <div class="editor-card">
      <div class="textarea-label-row">
        <label for="script-input">Roteiro de Leitura</label>
        <button id="btn-sample" class="sample-btn" type="button">Carregar Exemplo</button>
      </div>

      <textarea id="script-input" placeholder="Digite ou cole aqui o seu roteiro..."></textarea>
      
      <div class="meta-bar">
        <span id="char-word-count">0 palavras · 0 caracteres</span>
        <span id="reading-time-est">Tempo estimado: ~0 min</span>
      </div>

      <div class="btn-row">
        <button id="btn-clear" class="btn-secondary" type="button">Limpar</button>
        <button id="btn-confirm" class="btn-primary" type="button">▶ Confirmar e Carregar Texto</button>
      </div>
    </div>
  </div>

  <!-- READING SCREEN -->
  <div id="prompter-screen">
    <button id="exit-btn" type="button">← Voltar</button>
    <button id="toggle-hud-btn" type="button">Controles (H)</button>
    <div id="tap-hint">Toque na tela para Pausar/Iniciar</div>

    <div id="eye-guide">
      <span class="guide-marker">▶</span>
      <span class="guide-marker">◀</span>
    </div>

    <div id="prompter-container">
      <div id="prompter-text"></div>
    </div>

    <div id="hud-panel">
      <button id="hud-play-btn" class="hud-btn-main" type="button">▶ Iniciar</button>
      <button id="hud-restart-btn" class="hud-btn" type="button">↺ Início</button>

      <div class="control-group">
        <span class="control-label">Velocidade</span>
        <input type="range" id="speed-slider" min="1" max="10" step="1" value="3">
        <span id="speed-val" class="val-display">3x</span>
      </div>

      <div class="control-group">
        <span class="control-label">Fonte</span>
        <input type="range" id="font-slider" min="24" max="96" step="2" value="44">
        <span id="font-val" class="val-display">44px</span>
      </div>

      <button id="hud-mirror-btn" class="hud-btn" type="button">⇄ Espelho</button>
      <button id="hud-color-btn" class="hud-btn" type="button">🎨 Cor</button>
      <button id="hud-guide-btn" class="hud-btn active" type="button">👁 Guia</button>
    </div>
  </div>

  <script>
    const state = {
      isPlaying: false,
      speed: 3,
      fontSize: 44,
      isMirrored: false,
      textColor: '#ffffff',
      showGuide: true,
      scrollAccumulator: 0,
      animationFrameId: null,
      wakeLock: null
    };

    const setupScreen = document.getElementById('setup-screen');
    const prompterScreen = document.getElementById('prompter-screen');
    const scriptInput = document.getElementById('script-input');
    const prompterText = document.getElementById('prompter-text');
    const prompterContainer = document.getElementById('prompter-container');
    const btnConfirm = document.getElementById('btn-confirm');
    const btnSample = document.getElementById('btn-sample');
    const btnClear = document.getElementById('btn-clear');
    const exitBtn = document.getElementById('exit-btn');
    const toggleHudBtn = document.getElementById('toggle-hud-btn');
    const hudPanel = document.getElementById('hud-panel');
    const hudPlayBtn = document.getElementById('hud-play-btn');
    const hudRestartBtn = document.getElementById('hud-restart-btn');
    const hudMirrorBtn = document.getElementById('hud-mirror-btn');
    const hudColorBtn = document.getElementById('hud-color-btn');
    const hudGuideBtn = document.getElementById('hud-guide-btn');
    const eyeGuide = document.getElementById('eye-guide');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const fontSlider = document.getElementById('font-slider');
    const fontVal = document.getElementById('font-val');
    const charWordCount = document.getElementById('char-word-count');
    const readingTimeEst = document.getElementById('reading-time-est');
    const tapHint = document.getElementById('tap-hint');

    const sampleScript = `Olá a todos e sejam muito bem-vindos ao meu vídeo!

Hoje vamos demonstrar o funcionamento de um Teleprompter pessoal, gratuito e profissional.

Com esta ferramenta, você pode ler qualquer roteiro mantendo o contato visual contínuo e natural com a lente da câmera.

Recursos incluídos:
- Rolagem suave e contínua sem engasgos
- Controle dinâmico de velocidade e tamanho de fonte
- Espelhamento horizontal para uso em vidro refletor de teleprompter
- Atalhos rápidos no teclado e toque na tela para Play/Pause

Toque na tela ou pressione Espaço para pausar ou continuar a qualquer momento!

Obrigado por assistir e boas gravações!`;

    scriptInput.value = sampleScript;
    updateCounts();

    function updateCounts() {
      const txt = scriptInput.value.trim();
      const words = txt ? txt.split(/\s+/).length : 0;
      const chars = txt.length;
      charWordCount.textContent = words + ' palavras · ' + chars + ' caracteres';
      const minutes = (words / 130).toFixed(1);
      readingTimeEst.textContent = 'Tempo estimado: ~' + minutes + ' min';
    }

    scriptInput.addEventListener('input', updateCounts);
    btnSample.addEventListener('click', () => { scriptInput.value = sampleScript; updateCounts(); });
    btnClear.addEventListener('click', () => { scriptInput.value = ''; updateCounts(); scriptInput.focus(); });

    // Request wake lock to prevent mobile screen sleeping
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          state.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (state.wakeLock) {
        state.wakeLock.release().catch(() => {});
        state.wakeLock = null;
      }
    }

    // Confirmation
    btnConfirm.addEventListener('click', () => {
      const text = scriptInput.value.trim();
      if (!text) {
        alert('Por favor, digite ou cole um roteiro antes de continuar.');
        return;
      }
      prompterText.textContent = text;
      applyStyles();
      setupScreen.style.display = 'none';
      prompterScreen.style.display = 'block';
      prompterScreen.scrollTop = 0;
      state.scrollAccumulator = 0;
      
      // Auto hide hint after 4s
      setTimeout(() => {
        if (tapHint) tapHint.style.opacity = '0';
      }, 4000);
    });

    exitBtn.addEventListener('click', () => {
      pausePrompter();
      prompterScreen.style.display = 'none';
      setupScreen.style.display = 'flex';
    });

    toggleHudBtn.addEventListener('click', () => {
      hudPanel.classList.toggle('hidden');
    });

    // Tap anywhere on the reading viewport to Play / Pause (Mobile Friendly!)
    prompterScreen.addEventListener('click', (e) => {
      if (e.target.closest('#hud-panel, #exit-btn, #toggle-hud-btn')) {
        return;
      }
      togglePlay();
    });

    // Play / Pause Logic
    function togglePlay() {
      if (state.isPlaying) {
        pausePrompter();
      } else {
        playPrompter();
      }
    }

    function playPrompter() {
      if (state.isPlaying) return;
      state.isPlaying = true;
      requestWakeLock();

      hudPlayBtn.textContent = '⏸ Pausar';
      hudPlayBtn.style.background = '#ef4444';
      hudPlayBtn.style.color = '#ffffff';

      let lastTime = performance.now();

      function scrollLoop(currentTime) {
        if (!state.isPlaying) return;
        const delta = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        // Clamp delta to prevent huge jumps on tab switch / lag spike
        const safeDelta = Math.min(delta, 0.05);

        // Pixels per second calculation
        const pxPerSec = state.speed * 26 + 10;
        state.scrollAccumulator += pxPerSec * safeDelta;

        if (state.scrollAccumulator >= 1) {
          const toScroll = Math.floor(state.scrollAccumulator);
          prompterScreen.scrollTop += toScroll;
          state.scrollAccumulator -= toScroll;
        }

        // Check if reached bottom ONLY if we actually have room to scroll AND scrolled past 50px
        const maxScroll = prompterScreen.scrollHeight - prompterScreen.clientHeight;
        if (maxScroll > 60 && prompterScreen.scrollTop >= maxScroll - 6) {
          pausePrompter();
          return;
        }

        state.animationFrameId = requestAnimationFrame(scrollLoop);
      }

      state.animationFrameId = requestAnimationFrame(scrollLoop);
    }

    function pausePrompter() {
      state.isPlaying = false;
      releaseWakeLock();
      if (state.animationFrameId) {
        cancelAnimationFrame(state.animationFrameId);
        state.animationFrameId = null;
      }
      hudPlayBtn.textContent = '▶ Iniciar';
      hudPlayBtn.style.background = '#facc15';
      hudPlayBtn.style.color = '#000000';
    }

    hudPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    hudRestartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      pausePrompter();
      prompterScreen.scrollTop = 0;
      state.scrollAccumulator = 0;
    });

    speedSlider.addEventListener('input', (e) => {
      state.speed = parseInt(e.target.value, 10);
      speedVal.textContent = state.speed + 'x';
    });

    fontSlider.addEventListener('input', (e) => {
      state.fontSize = parseInt(e.target.value, 10);
      fontVal.textContent = state.fontSize + 'px';
      prompterText.style.fontSize = state.fontSize + 'px';
    });

    function toggleMirror() {
      state.isMirrored = !state.isMirrored;
      applyMirror();
    }

    function applyMirror() {
      if (state.isMirrored) {
        prompterContainer.classList.add('mirror-x');
        hudMirrorBtn.classList.add('active');
      } else {
        prompterContainer.classList.remove('mirror-x');
        hudMirrorBtn.classList.remove('active');
      }
    }

    hudMirrorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMirror();
    });

    const colors = ['#ffffff', '#facc15', '#4ade80', '#38bdf8'];
    let colorIdx = 0;
    hudColorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      colorIdx = (colorIdx + 1) % colors.length;
      state.textColor = colors[colorIdx];
      prompterText.style.color = state.textColor;
    });

    hudGuideBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.showGuide = !state.showGuide;
      eyeGuide.style.display = state.showGuide ? 'flex' : 'none';
      hudGuideBtn.classList.toggle('active', state.showGuide);
    });

    function applyStyles() {
      prompterText.style.fontSize = state.fontSize + 'px';
      prompterText.style.color = state.textColor;
      applyMirror();
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (prompterScreen.style.display === 'block') {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleMirror();
        } else if (e.code === 'KeyR' || e.code === 'Home') {
          e.preventDefault();
          pausePrompter();
          prompterScreen.scrollTop = 0;
        } else if (e.code === 'ArrowUp') {
          e.preventDefault();
          if (state.speed < 10) {
            state.speed++;
            speedSlider.value = state.speed;
            speedVal.textContent = state.speed + 'x';
          }
        } else if (e.code === 'ArrowDown') {
          e.preventDefault();
          if (state.speed > 1) {
            state.speed--;
            speedSlider.value = state.speed;
            speedVal.textContent = state.speed + 'x';
          }
        } else if (e.code === 'KeyH') {
          e.preventDefault();
          hudPanel.classList.toggle('hidden');
        } else if (e.code === 'Escape') {
          e.preventDefault();
          pausePrompter();
          prompterScreen.style.display = 'none';
          setupScreen.style.display = 'flex';
        }
      }
    });
  </script>
</body>
</html>
